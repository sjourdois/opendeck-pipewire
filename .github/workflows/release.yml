name: Release

# Builds the .sdPlugin bundle with native binaries for x86_64 and aarch64 Linux.
# On a pushed tag (v*) the zipped bundle is attached to the GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed for the package job to create the GitHub release and upload the bundle.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PLUGIN: fr.jourdois.pipewire.sdPlugin

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PipeWire build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Each architecture is built natively on its own runner, so the bindgen-based
      # pipewire-sys crate finds the right system headers — no cross-compilation.
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        run: |
          mkdir -p stage/${{ matrix.target }}/bin
          cp target/${{ matrix.target }}/release/opendeck-pipewire \
             stage/${{ matrix.target }}/bin/opendeck-pipewire

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: stage/

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: bins

      - name: Assemble .sdPlugin bundle
        run: |
          mkdir -p "$PLUGIN"
          cp -r assets/manifest.json assets/icons assets/propertyInspector "$PLUGIN/"
          cp -r bins/* "$PLUGIN/"
          chmod 755 "$PLUGIN"/*/bin/opendeck-pipewire
          zip -r "$PLUGIN.zip" "$PLUGIN"
          echo "Bundle contents:" && find "$PLUGIN" -type f | sort

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}
          path: ${{ env.PLUGIN }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PLUGIN }}.zip
