<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			let update = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				const context = inActionInfo.context;
				const settings = inActionInfo.payload.settings;

				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
				};

				const mode = document.getElementById("mode");
				mode.value = (settings.inverted ?? false) ? "mute" : "talk";

				update = () => {
					websocket.send(JSON.stringify({
						event: "setSettings",
						context: context,
						payload: { inverted: mode.value === "mute" },
					}));
				};
			}
		</script>
		<link rel="stylesheet" href="sdpi.css" />
	</head>
	<body>
		<div class="sdpi-wrapper">
			<div class="action-title">Push to Talk</div>
			<div class="action-desc">Control the default microphone while the key is held — hold to talk (unmute), or push to mute.</div>
			<div class="sdpi-item">
				<div class="sdpi-item-label">Mode</div>
				<select id="mode" class="sdpi-item-value select" onchange="update()">
					<option value="talk">Push to talk (hold to unmute)</option>
					<option value="mute">Push to mute (hold to mute)</option>
				</select>
			</div>
		</div>
	</body>
</html>
