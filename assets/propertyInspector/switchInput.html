<!DOCTYPE html>
<html lang="en">
	<head>
		<script>
			let update = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				const context = inActionInfo.context;
				const selected = inActionInfo.payload.settings.source ?? "";

				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
				};

				const source = document.getElementById("source");

				update = () => {
					websocket.send(JSON.stringify({
						event: "setSettings",
						context: context,
						payload: { source: source.value },
					}));
				};

				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);
					if (data.event == "sendToPropertyInspector" && data.payload && data.payload.event == "sources") {
						source.innerHTML = "";
						const placeholder = document.createElement("option");
						placeholder.value = "";
						placeholder.innerText = "— select input —";
						source.appendChild(placeholder);
						for (const s of data.payload.sources) {
							const option = document.createElement("option");
							option.value = s.name;
							option.innerText = s.description;
							if (s.name == selected) option.selected = true;
							source.appendChild(option);
						}
					}
				};
			}
		</script>
		<link rel="stylesheet" href="sdpi.css" />
	</head>
	<body>
		<div class="sdpi-wrapper">
			<div class="sdpi-item">
				<div class="sdpi-item-label">Input</div>
				<select id="source" class="sdpi-item-value select" onchange="update()">
					<option value="">— select input —</option>
				</select>
			</div>
		</div>
	</body>
</html>
