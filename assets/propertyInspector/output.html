<!DOCTYPE html>
<html lang="en">
	<head>
		<script>
			let update = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				const context = inActionInfo.context;
				const selected = inActionInfo.payload.settings.sink ?? "";

				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
				};

				const sink = document.getElementById("sink");

				update = () => {
					websocket.send(JSON.stringify({
						event: "setSettings",
						context: context,
						payload: { sink: sink.value },
					}));
				};

				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);
					if (data.event == "sendToPropertyInspector" && data.payload && data.payload.event == "sinks") {
						sink.innerHTML = "";
						const placeholder = document.createElement("option");
						placeholder.value = "";
						placeholder.innerText = "— select output —";
						sink.appendChild(placeholder);
						for (const s of data.payload.sinks) {
							const option = document.createElement("option");
							option.value = s.name;
							option.innerText = s.description;
							if (s.name == selected) option.selected = true;
							sink.appendChild(option);
						}
					}
				};
			}
		</script>
		<link rel="stylesheet" href="sdpi.css" />
	</head>
	<body>
		<div class="sdpi-wrapper">
			<div class="sdpi-item">
				<div class="sdpi-item-label">Output</div>
				<select id="sink" class="sdpi-item-value select" onchange="update()">
					<option value="">— select output —</option>
				</select>
			</div>
		</div>
	</body>
</html>
