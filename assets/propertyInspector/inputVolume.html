<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<script>
			let update = () => {};
			let syncStep = () => {};
			let syncLabel = () => {};

			function connectElgatoStreamDeckSocket(inPort, inPropertyInspectorUUID, inRegisterEvent, inInfo, inActionInfo) {
				const websocket = new WebSocket("ws://localhost:" + inPort);
				inActionInfo = JSON.parse(inActionInfo);
				const context = inActionInfo.context;
				const settings = inActionInfo.payload.settings;

				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inPropertyInspectorUUID }));
				};

				const source = document.getElementById("source");
				const name = document.getElementById("name");
				const step = document.getElementById("step");
				const stepValue = document.getElementById("stepValue");
				const mode = document.getElementById("mode");
				const unmute = document.getElementById("unmute");
				const mute = document.getElementById("mute");

				const useName = document.getElementById("useName");
				let customName = settings.name ?? "";
				// Checked = use the device's own name; unchecked frees a custom label.
				useName.checked = !customName;
				// The selected picker option's text is the device's friendly description.
				const deviceDesc = () => (source.value && source.selectedOptions[0]) ? source.selectedOptions[0].text : "";
				syncLabel = () => {
					name.disabled = useName.checked;
					name.value = useName.checked ? deviceDesc() : customName;
				};
				name.addEventListener("input", () => { customName = name.value; });
				syncLabel();
				step.value = settings.step ?? 5;
				stepValue.innerText = step.value + "%";
				mode.value = settings.mode ?? "up";
				unmute.value = settings.unmute_color ?? "#3db36b";
				mute.value = settings.mute_color ?? "#ff3b30";

				const isKeypad = inActionInfo.payload.controller != "Encoder";
				if (!isKeypad) document.getElementById("direction").style.display = "none";
				const stepRow = document.getElementById("stepRow");
				syncStep = () => { stepRow.style.display = (isKeypad && mode.value == "mute") ? "none" : ""; };
				syncStep();

				step.addEventListener("input", () => { stepValue.innerText = step.value + "%"; });

				update = () => {
					websocket.send(JSON.stringify({
						event: "setSettings",
						context: context,
						payload: {
							source: source.value,
							// Use the tracked custom label, not the live field: when
							// "Device name" is unchecked the field still momentarily
							// shows the (disabled) device description.
							name: useName.checked ? "" : customName,
							step: parseInt(step.value, 10),
							mode: mode.value,
							unmute_color: unmute.value,
							mute_color: mute.value,
						},
					}));
				};

				const warning = document.getElementById("warning");
				let current = settings.source ?? "";
				const renderSources = (sources, loaded) => {
					// Preserve the user's live pick across re-renders (the list can be
					// re-delivered), falling back to the saved setting on first load.
					current = source.value || current;
					source.innerHTML = "";
					source.appendChild(new Option("— select input —", ""));
					let found = false;
					for (const s of sources) {
						const option = new Option(s.description, s.name);
						if (s.name == current) {
							option.selected = true;
							found = true;
						}
						source.appendChild(option);
					}
					// Keep the saved device shown even before the list arrives, or if
					// it isn't currently available (e.g. a hardware profile switch); in
					// the latter case warn once the list has actually loaded.
					if (current && !found) {
						const option = new Option(current, current);
						option.selected = true;
						source.appendChild(option);
					}
					warning.style.display = loaded && current && !found ? "" : "none";
					// Refresh the greyed "device name" label now the descriptions are in.
					syncLabel();
				};
				renderSources([], false);

				websocket.onmessage = (event) => {
					const data = JSON.parse(event.data);
					if (data.event == "sendToPropertyInspector" && data.payload && data.payload.event == "sources") {
						renderSources(data.payload.sources, true);
					}
				};
			}
		</script>
		<link rel="stylesheet" href="sdpi.css" />
	</head>
	<body>
		<div class="sdpi-wrapper">
			<div class="action-title">Input Device Volume</div>
			<div class="action-desc">Adjust a specific input device's volume. On a keypad, choose whether a press raises, lowers, or mutes; an encoder rotates for volume and presses to mute.</div>
			<div class="sdpi-item">
				<div class="sdpi-item-label">Input</div>
				<select id="source" class="sdpi-item-value select" onchange="update(); syncLabel()">
					<option value="">— select input —</option>
				</select>
			</div>
			<div id="warning" style="display: none; margin: -4px 0 8px; color: #f7821b; font-size: 9pt">
				⚠ The saved input isn't currently available.
			</div>
			<div class="sdpi-item">
				<div class="sdpi-item-label">Label</div>
				<div class="sdpi-item-value label-row">
					<input id="useName" type="checkbox" onchange="update(); syncLabel()" />
					<label for="useName" class="cap">Device name</label>
					<input id="name" type="text" placeholder="Custom label" onchange="update()" />
				</div>
			</div>
			<div class="sdpi-item" id="direction">
				<div class="sdpi-item-label">On press</div>
				<select id="mode" class="sdpi-item-value select" onchange="update(); syncStep()">
					<option value="up">Volume up</option>
					<option value="down">Volume down</option>
					<option value="mute">Toggle mute</option>
				</select>
			</div>
			<div class="sdpi-item" id="stepRow">
				<div class="sdpi-item-label">Step (<span id="stepValue">5%</span>)</div>
				<input id="step" class="sdpi-item-value" type="range" min="1" max="20" value="5" onchange="update()" />
			</div>
			<div class="sdpi-item">
				<div class="sdpi-item-label">Bar color</div>
				<input id="unmute" class="sdpi-item-value" type="color" value="#3db36b" onchange="update()" />
			</div>
			<div class="sdpi-item">
				<div class="sdpi-item-label">Muted color</div>
				<input id="mute" class="sdpi-item-value" type="color" value="#ff3b30" onchange="update()" />
			</div>
		</div>
	</body>
</html>
